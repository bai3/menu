  <style>
    html,body{margin:0;background:#f8f0e4}
    .launch{display:none}
    .is-pwa .launch{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#f8f0e4;color:#654537}
    .launch::before{content:"";position:absolute;inset:0;opacity:.28;background-image:radial-gradient(#d7bba1 .6px,transparent .6px);background-size:5px 5px}
    .launch-inner{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateY(-2vh)}
    .launch-mark{width:108px;height:108px;border-radius:32px;box-shadow:0 14px 32px #a65d4230}
    .launch-name{margin:27px 0 0;font:600 27px/1.3 "Songti SC","STSong",serif;letter-spacing:.2em;text-indent:.2em}
    .launch-subtitle{margin:12px 0 0;color:#ad8b76;font:11px/1.5 "PingFang SC",sans-serif;letter-spacing:.28em;text-indent:.28em}
    .launch-footer{position:absolute;bottom:max(42px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;color:#bca28e;font:10px/1.5 "PingFang SC",sans-serif;letter-spacing:.15em}
    .launch-footer::before,.launch-footer::after{content:"";width:22px;height:1px;background:#d7c2af}
    .launch[hidden]{display:none}
    .startup-retry{display:none;position:fixed;bottom:48px;left:50%;transform:translateX(-50%);z-index:10000;border:1px solid #dfc3b0;border-radius:20px;padding:10px 18px;background:#fff9f1;color:#9d604a}
    .startup-failed .startup-retry{display:block}
  </style>
  <script>
    var nativeApp=/JiayanAndroid\//.test(navigator.userAgent)||!!window.JiayanImageExport;
    if(nativeApp)document.documentElement.classList.add('is-native','is-standalone');
    else if(matchMedia('(display-mode: standalone)').matches||navigator.standalone===true)document.documentElement.classList.add('is-pwa','is-standalone');
  </script>
  <script src="./src/i18n.js"></script>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./theme.css" />
</head>
<body>
  <div class="launch" id="launch" aria-label="家宴启动页">
    <div class="launch-inner"><img class="launch-mark" src="./public/assets/icon-192.png" alt="" /><p class="launch-name">家宴</p><p class="launch-subtitle">家的味道，日日有新意</p></div>
    <div class="launch-footer">为每一顿家常饭</div>
  </div>
  <button class="startup-retry" type="button" onclick="location.reload()">暂时无法打开，点击重试</button>
  <main class="presentation">
    <aside class="intro" aria-label="设计说明">
      <div class="brand"><span class="brand-mark" aria-label="家宴标志"><svg viewBox="0 0 40 40" aria-hidden="true"><path class="brand-bowl" d="M9.8 18.7h20.4q.9 0 .7.9c-1 5.2-4.9 8-10.9 8s-9.9-2.8-10.9-8q-.2-.9.7-.9Z"/><path class="brand-foot" d="M16.8 29h6.4"/><path class="brand-smile" d="M15.8 24.6q4.2 2 8.4 0"/><path class="brand-chopsticks" d="m14.9 17 9.4-8m-6.6 8 9.4-8"/></svg></span><span>家宴 <small>家的味道</small></span></div>
      <div class="intro-main"><p class="eyebrow"><span></span> 为每一顿家常饭</p><h1>把喜欢的菜，<br><em>端上家的餐桌。</em></h1><p class="intro-copy">今天想吃什么？<br>一起点菜，把平凡的一餐变成值得期待的小事。</p><div class="intro-line"></div><div class="steps"><span><b>01</b> 挑选喜欢的菜</span><i>—</i><span><b>02</b> 生成专属菜单</span></div></div>
      <div class="intro-footer"><span>为每一顿家常饭，留一点仪式感。</span><span>家宴 · 好好吃饭</span></div>
      <div class="intro-stamp" aria-hidden="true">好好<br>吃饭 <span>✳</span></div>
    </aside>
    <section class="phone-wrap" aria-label="家宴手机界面预览">
      <div class="phone"><div class="phone-screen" id="app"></div></div>
      <p class="phone-caption">家宴 <span>·</span> 你的家庭点菜小助手</p>
    </section>
  </main>
  <script src="./src/startup.js"></script>

  <script defer src="./src/nutrition.js"></script>
  <script defer src="./src/menu-image.js"></script>
  <script defer src="./src/paper-menu.js"></script>
  <script defer src="./src/auth.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
