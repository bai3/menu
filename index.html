<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f0e4" />
  <link rel="icon" type="image/svg+xml" href="./public/assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./public/assets/icon-192.png" />
  <title>白家私厨 · 今天吃什么</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./public/assets/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="白家私厨" />
  <style>
    html,body{margin:0;background:#f8f0e4}
    .launch{display:none}
    .is-standalone .launch{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:#f8f0e4;color:#654537;transition:opacity .4s ease,visibility .4s ease}
    .launch::before{content:"";position:absolute;inset:0;opacity:.28;background-image:radial-gradient(#d7bba1 .6px,transparent .6px);background-size:5px 5px}
    .launch-inner{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateY(-2vh)}
    .launch-mark{width:108px;height:108px;border-radius:32px;box-shadow:0 14px 32px #a65d4230}
    .launch-retry{display:none;margin-top:22px;border:1px solid #dfc3b0;border-radius:20px;padding:9px 18px;background:#fff9f1;color:#9d604a;font:12px "PingFang SC",sans-serif}
    .launch.has-error .launch-retry{display:block}
    .launch-name{margin:27px 0 0;font:600 27px/1.3 "Songti SC","STSong",serif;letter-spacing:.2em;text-indent:.2em}
    .launch-subtitle{margin:12px 0 0;color:#ad8b76;font:11px/1.5 "PingFang SC",sans-serif;letter-spacing:.28em;text-indent:.28em}
    .launch-footer{position:absolute;bottom:max(42px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;color:#bca28e;font:10px/1.5 "PingFang SC",sans-serif;letter-spacing:.15em}
    .launch-footer::before,.launch-footer::after{content:"";width:22px;height:1px;background:#d7c2af}
    .launch.is-finished{opacity:0;visibility:hidden;pointer-events:none}
    @media(prefers-reduced-motion:reduce){.launch{transition:none!important}}
  </style>
  <script>if (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) document.documentElement.classList.add('is-standalone');</script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="launch" id="launch">
    <div class="launch-inner"><svg class="launch-mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#b85f48"/><circle cx="256" cy="256" r="205" fill="none" stroke="#edc3ad" stroke-opacity=".55" stroke-width="2"/><circle cx="256" cy="256" r="190" fill="none" stroke="#edc3ad" stroke-opacity=".3" stroke-width="2"/><g fill="none" stroke="#fff7ea" stroke-linecap="round" stroke-linejoin="round"><path d="M135 270h242c-8 74-55 119-121 119s-113-45-121-119Z" stroke-width="13"/><path d="M160 400h192" stroke-width="10"/><path d="M198 226c-22-28 22-43 1-72M256 226c-22-28 22-43 1-72M314 226c-22-28 22-43 1-72" stroke-width="11"/></g><circle cx="130" cy="216" r="4" fill="#f6d9c7"/><circle cx="382" cy="216" r="4" fill="#f6d9c7"/></svg><p class="launch-name">白家私厨</p><p class="launch-subtitle">家的味道，日日有新意</p><button class="launch-retry" type="button" onclick="location.reload()">加载较慢，点击重试</button></div>
    <div class="launch-footer">为每一顿家常饭</div>
  </div>
  <script>setTimeout(function(){var el=document.getElementById('launch');if(el&&!el.classList.contains('is-finished'))el.classList.add('has-error')},15000);</script>
  <main class="presentation">
    <aside class="intro" aria-label="设计说明">
      <div class="brand"><span class="brand-mark" aria-label="白家私厨标志"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 22h24c-.7 7-5.5 11-12 11S8.7 29 8 22Z"/><path d="M13 18c-2-3 3-4 1-7M20 18c-2-3 3-4 1-7M27 18c-2-3 3-4 1-7"/></svg></span><span>白家私厨 <small>家的味道</small></span></div>
      <div class="intro-main"><p class="eyebrow"><span></span> 为每一顿家常饭</p><h1>把喜欢的菜，<br><em>端上家的餐桌。</em></h1><p class="intro-copy">今天想吃什么？<br>一起点菜，把平凡的一餐变成值得期待的小事。</p><div class="intro-line"></div><div class="steps"><span><b>01</b> 挑选喜欢的菜</span><i>—</i><span><b>02</b> 生成专属菜单</span></div></div>
      <div class="intro-footer"><span>为每一顿家常饭，留一点仪式感。</span><span>白家私厨 · 好好吃饭</span></div>
      <div class="intro-stamp" aria-hidden="true">好好<br>吃饭 <span>✳</span></div>
    </aside>
    <section class="phone-wrap" aria-label="白家私厨手机界面预览">
      <div class="phone"><div class="phone-screen" id="app"></div></div>
      <p class="phone-caption">白家私厨 <span>·</span> 你的家庭点菜小助手</p>
    </section>
  </main>
  <script defer src="./config.js"></script>
  <script defer src="./public/vendor/supabase.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
