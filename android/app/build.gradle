plugins { id 'com.android.application' }

android {
    namespace 'com.bai.jiayan'
    compileSdk 36
    defaultConfig {
        applicationId 'com.bai.jiayan'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
        buildConfigField 'String', 'WEB_URL', '"https://bai3.github.io/menu/"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
